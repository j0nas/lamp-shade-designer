<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lamp Shade Designer</title>
  </head>
  <body>
    <!-- Canvas host: the viewer fills this. -->
    <div id="app"></div>

    <!-- Control overlay. #controls is left empty for renderPanel(); everything else is app chrome. -->
    <aside id="panel">
      <h1>Lamp Shade</h1>

      <!-- Design library: named save/load, JSON export/import, share links. App chrome, not schema. -->
      <section class="group" id="designs-group">
        <h2>Designs</h2>
        <div class="sel">
          <label for="design-select">Saved</label>
          <select id="design-select"></select>
        </div>
        <input id="design-name" type="text" placeholder="Design name" aria-label="Design name" />
        <div class="curve-tools">
          <button type="button" id="design-save">Save</button>
          <button type="button" id="design-duplicate">Duplicate</button>
          <button type="button" id="design-delete">Delete</button>
        </div>
        <div class="curve-tools">
          <button type="button" id="design-export">Export</button>
          <button type="button" id="design-import">Import</button>
          <button type="button" id="design-link">Copy link</button>
        </div>
        <input id="design-file" type="file" accept=".json,application/json" hidden />
      </section>

      <!-- Layers: the shade as a stack of printed shells. App chrome — the panel below edits
           whichever layer is selected here. -->
      <section class="group" id="layers-group">
        <h2>Layers</h2>
        <div id="layer-list"></div>
        <div class="curve-tools">
          <button type="button" id="layer-add" title="Add a nested inner layer">Add inner</button>
          <button type="button" id="layer-duplicate">Duplicate</button>
          <button type="button" id="layer-delete">Delete</button>
        </div>
        <div class="row">
          <label for="layer-color">Colour</label>
          <input id="layer-color" type="color" value="#f3ece0" />
          <output id="layer-color-out">#f3ece0</output>
        </div>
        <div class="row">
          <label for="layer-opacity">Opacity</label>
          <input id="layer-opacity" type="range" min="0.15" max="1" step="0.05" value="1" />
          <output id="layer-opacity-out">1.00</output>
        </div>
      </section>

      <!-- Silhouette editor: app-owned, not a schema param (a curve is control points, not a scalar). -->
      <section class="group" id="silhouette-group">
        <h2>Silhouette</h2>
        <div class="sel" id="curve-link-row">
          <label for="curve-link">Shape</label>
          <select id="curve-link">
            <option value="free">Drawn</option>
            <option value="nest">Nested in outer</option>
          </select>
        </div>
        <div class="row" id="nest-gap-row">
          <label for="nest-gap">Air gap</label>
          <input id="nest-gap" type="range" min="1" max="40" step="0.5" value="6" />
          <output id="nest-gap-out">6 mm</output>
        </div>
        <div class="sel" id="family-row">
          <label for="family">Family</label>
          <select id="family"></select>
        </div>
        <div id="curve-wrap">
          <canvas id="curve" width="300" height="240" aria-label="Silhouette profile editor"></canvas>
          <!-- Filled by the editor with the markings currently drawn; CSS shows it when expanded. -->
          <div id="curve-legend"></div>
          <div id="curve-inspector">
            <label class="pt-field"
              >r
              <span class="num"><input id="pt-r" type="number" step="0.1" disabled /><span class="unit">mm</span></span>
            </label>
            <label class="pt-field"
              >z
              <span class="num"><input id="pt-z" type="number" step="0.1" disabled /><span class="unit">mm</span></span>
            </label>
            <button type="button" id="curve-expand" title="Expand the editor">⤢</button>
          </div>
        </div>
        <div class="curve-tools">
          <button type="button" id="curve-smooth">Smooth</button>
          <button type="button" id="curve-mirror">Mirror</button>
          <button type="button" id="curve-reset">Reset</button>
        </div>
        <p class="sub">
          Drag points — Shift for fine moves. Click the curve to add a point; Delete removes the
          selected one; arrows nudge it (Shift = 0.1 mm). Ctrl/⌘ Z undoes.
        </p>
      </section>

      <!-- renderPanel() fills this with the schema groups. -->
      <div id="controls"></div>

      <!-- View controls: app chrome, must not persist or dirty presets. -->
      <section class="group" id="view-group">
        <h2>View</h2>
        <div class="sel">
          <label for="view-mode">Mode</label>
          <select id="view-mode">
            <option value="cad">CAD (lit for form)</option>
            <option value="lamp">Lamp on (cast light)</option>
            <option value="overhang">Overhang check (printability)</option>
          </select>
        </div>
        <div class="row">
          <label for="dim">Room brightness</label>
          <input id="dim" type="range" min="0" max="1" step="0.02" value="0.12" />
          <output id="dim-out">0.12</output>
        </div>
        <div class="toggle">
          <label><input id="show-bulb" type="checkbox" checked /> Show bulb</label>
        </div>
        <div class="toggle">
          <label><input id="show-fitter" type="checkbox" checked /> Show fitter</label>
        </div>
        <div class="toggle">
          <label><input id="section-cut" type="checkbox" /> Section cut</label>
        </div>
      </section>

      <div id="dims"></div>
      <div id="warnings"></div>

      <div id="downloads">
        <button type="button" id="dl-shade-stl">Shade STL</button>
        <button type="button" id="dl-shade-3mf">Shade 3MF</button>
        <button type="button" id="dl-fitter-stl">Fitter STL</button>
        <button type="button" id="dl-fitter-step">Fitter STEP</button>
      </div>

      <button type="button" id="reset-all" class="muted">Reset design to defaults</button>
    </aside>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
