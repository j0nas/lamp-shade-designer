name: Deploy to GitHub Pages

# This repo is the source of truth for the lamp shade designer. Every push to main
# builds the app and publishes it to GitHub Pages; jonas-jensen.com embeds the live
# deploy by proxying /apps/lamp-shade/* to the Pages URL, so pushing here is what
# ships the change to the desktop — nothing is re-vendored by hand.
#
# The app is self-contained: parametric-kit lives in vendor/parametric-kit (a frozen copy,
# see its README) and is linked from there, so one checkout is all CI needs.

on:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege for the Pages deployment.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          # This repo declares pnpm under devEngines rather than the `packageManager`
          # field action-setup reads, so pin the version explicitly.
          version: 12.6.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      # Tests gate the deploy: the geometry probes (genus == holes + 1, positive
      # orientation) and the dual-kernel fitter equivalence check are exactly what
      # must not ship broken.
      - name: Test
        # The `test` script is already `vp test --run`; don't append another
        # --run (vitest rejects the duplicated single-value option).
        run: pnpm test
      - name: Build
        run: pnpm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
